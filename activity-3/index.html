<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <meta name="description" content=" JS activity-3 DOM model">
        <meta name="keywords" content="JS, DOM, MATC">
        <link rel="stylesheet" href="/Naunihal-Singh/activity-3/styles.css">

        <title>Activity-3: Dynamic Greeting Card </title>
    </head>
    <body>
        <h1>Activity 3: Dynamic Greeting Card</h1>
        <div class="card-container">
            <h2 id="greeting-message">Welcome!</h2>
            <img id="greeting-image" src="default-image.jpg" alt="Greeting Image" />
        </div>
        <div class="controls">
            <h3>Change Greeting:</h3>
            <button onclick="setBirthdayGreeting()">Birthday</button>
            <button onclick="setHolidayGreeting()">Holiday</button>
            <button onclick="setThankYouGreeting()">Thank You</button>
            <button onclick="setRandomGreeting()">Random</button>

        </div>
        <div class="personalize">
            <h3>Personalize:</h3>
            <input type="text" id="nameInput" placeholder="Enter your name">
            <button onclick="personalizeGreeting()">Add Name</button>

        </div> 
        <script src="/Naunihal-Singh/activity-3/script.js"></script>
    </body>

</html>
