<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JS activity-4 To Do List">
    <meta name="keywords" content="JS, DOM, MATC">
    <title>Activity-4: Interactive To Do List</title>
    <link rel="stylesheet" href="/Naunihal-Singh/activity-4/styles.css">
</head>
<body>
    <h1>Activity-4: Interactive To Do List</h1>
    <div class="todo-container">
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter new tasks here">
            <button id="addTaskButton">Add Task</button>
        </div>   
        <div class="list-section">
            <h2>Your tasks
                <span id="taskCount"></span>
            </h2>
                <ul id="todo-List">                </ul>
        </div> 

        <div class="stats-section">
            <span id="totalTasks"></span>
            <span id="completedTasks"></span>
            <span id="pendingTasks"></span>
        </div>
    </div>
    <script src="/Naunihal-Singh/activity-4/scripts.js">

    </script>

</body>
</html>
